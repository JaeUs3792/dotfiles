# Read by /usr/bin/vivaldi-stable ($XDG_CONFIG_HOME/vivaldi-$CHROME_VERSION_EXTRA.conf)
#
# --password-store=kwallet6 makes Chromium treat the session as KDE, so it
# picks up KWin's per-output scale from ~/.config/kwinoutputconfig.json
# (DP-0 is set to 1.5 there). Under bspwm nothing else honours that scale, so
# Vivaldi lays out at 3840x2160 / 1.5 = 2560x1440 while the X window stays
# 3840x2160 and everything outside that top-left area is left black.
# Pinning the scale to 1 keeps kwallet and paints the whole window.
--force-device-scale-factor=1
